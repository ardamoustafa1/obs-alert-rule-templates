# promtool test rules testdata/promtool/fast-burn.test.yaml
#
# Proves the fast-burn tier (1h/5m windows, 14.4x burn rate) fires once BOTH
# windows have observed a sustained ~10% error ratio -- far above the
# 14.4 * (1 - 0.999) = 0.0144 threshold -- for the full `for: 2m`.
#
# Timeline: the 1h window only has enough history to be non-empty starting
# at t=60m, so the earliest the condition can become continuously true is
# t=60m; with `for: 2m` the alert becomes firing at t=62m. eval_time=65m
# checks a point comfortably past that.
rule_files:
  - rules/burn-rate-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_server_request_errors_total{service="checkout-api",environment="prod"}'
        values: "0+10x100"
      - series: 'http_server_requests_total{service="checkout-api",environment="prod"}'
        values: "0+100x100"

    alert_rule_test:
      - eval_time: 65m
        alertname: CheckoutApiErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              alert_type: burn_rate
              burn_rate_window: 1h/5m
              environment: prod
              service: checkout-api
              severity: page
              slo_target: "0.999"
              team: team-checkout
            exp_annotations:
              description: Observed error ratio over both the 1h and 5m windows exceeds 14.4x the allowed burn rate for a 0.999 availability target. At this rate the 30 day error budget empties in about ~2 days.
              runbook_url: https://runbooks.acme.com/http/CheckoutApiErrorBudgetBurnFast
              summary: checkout-api is burning its error budget 14.4x faster than sustainable (1h/5m window)

      # A ~10% error ratio also clears the slow-burn threshold (0.006), so
      # both tiers legitimately co-fire during a severe outage -- multi-tier
      # alerting is additive, not either/or.
      - eval_time: 65m
        alertname: CheckoutApiErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              alert_type: burn_rate
              burn_rate_window: 6h/30m
              environment: prod
              service: checkout-api
              severity: page
              slo_target: "0.999"
              team: team-checkout
            exp_annotations:
              description: Observed error ratio over both the 6h and 30m windows exceeds 6x the allowed burn rate for a 0.999 availability target. At this rate the 30 day error budget empties in about ~5 days.
              runbook_url: https://runbooks.acme.com/http/CheckoutApiErrorBudgetBurnSlow
              summary: checkout-api is burning its error budget 6x faster than sustainable (6h/30m window)

      # Before the 1h window has any history at all, neither alert can be
      # pending, let alone firing -- this is the noise-reduction property:
      # no page fires off a single early sample.
      - eval_time: 1m
        alertname: CheckoutApiErrorBudgetBurnFast
        exp_alerts: []
